# OPTIONAL. Most people should just run the backend/frontend directly (see README) -
# this is provided as a convenience for anyone who prefers containers.
# Note: the "ollama" service still needs `docker exec mental-gym-ollama ollama pull <model>`
# run once, since model weights aren't baked into the image.
version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: mental-gym-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build: ./backend
    container_name: mental-gym-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./mental_gym.db
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen2.5:3b
      - OLLAMA_BASE_URL=http://ollama:11434
      - FRONTEND_ORIGIN=http://localhost:3000
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    container_name: mental-gym-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  ollama-data:
